name: Publish A&N Overseas independently
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
      - name: Fetch original A&N website (read only)
        run: |
          git clone --depth 1 https://github.com/mehedialimayon-del/salesman-performance-app.git /tmp/fieldforce-source
          mkdir -p site
          cp -a /tmp/fieldforce-source/an-overseas/. site/
      - name: Adapt only deployment URLs and PWA scope
        shell: python
        run: |
          from pathlib import Path
          root=Path('site')
          old='https://mehedialimayon-del.github.io/salesman-performance-app/an-overseas/'
          new='https://anoverseaseducation.com/'
          oldpath='/salesman-performance-app/an-overseas/'
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.js','.css','.json','.webmanifest','.md'}:
                  continue
              try:
                  text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated=text.replace(old,new).replace(oldpath,'/')
              if updated!=text:
                  p.write_text(updated,encoding='utf-8')
          (root/'CNAME').write_text('anoverseaseducation.com\n',encoding='utf-8')
          (root/'.nojekyll').touch()
      - name: Apply A&N-only maintained overrides
        run: |
          if [ -d overrides ]; then
            cp -a overrides/. site/
          fi
      - name: Publish independently sourced admissions examples
        run: |
          mkdir -p site/data
          cp data/official-admissions-samples.json site/data/official-admissions-samples.json
      - name: Generate conservative university data-quality inventory
        run: |
          python3 scripts/audit_university_assets.py
          python3 scripts/validate_university_programmes.py
      - name: Publish crawler configuration
        run: |
          cp robots.txt site/robots.txt
          cp sitemap.xml site/sitemap.xml
      - name: Validate SEO deployment assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import re
          root = Path('site')
          html = (root / 'index.html').read_text(encoding='utf-8')
          robots = (root / 'robots.txt').read_text(encoding='utf-8')
          sitemap = root / 'sitemap.xml'
          assert sitemap.is_file(), 'Missing deployed sitemap.xml'
          urls = [node.text for node in ET.parse(sitemap).iter() if node.tag.endswith('}loc') or node.tag == 'loc']
          assert 'https://anoverseaseducation.com/' in urls, 'Canonical home URL missing from sitemap'
          assert 'Sitemap: https://anoverseaseducation.com/sitemap.xml' in robots
          assert 'name="viewport"' in html, 'Mobile viewport missing'
          assert 'https://anoverseaseducation.com/' in html, 'Canonical domain missing'
          assert re.search(r'<title>[^<]+</title>', html, re.I), 'HTML title missing'
          print('SEO deployment asset validation passed')
          PY
      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: anoverseaseducation.com
